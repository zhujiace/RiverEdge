[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "river-vllm-edge"
version = "0.1.0"
description = "RiverEdge vLLM custom model prototypes"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["river_vllm_ext*"]

[project.entry-points."vllm.general_plugins"]
riveredge_models = "river_vllm_ext.plugin:register"
